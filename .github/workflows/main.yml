name: Build NRO

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Switch libraries
        run: |
          dkp-pacman -Sy --noconfirm --needed \
            switch-pkg-config switch-sdl2 switch-ffmpeg switch-glad switch-mesa

      - name: Build
        run: make -j$(nproc)

      - uses: actions/upload-artifact@v4
        with:
          name: NXVRPlayer
          path: NXVRPlayer.nro
